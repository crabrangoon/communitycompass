<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join the Waitlist</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #111827;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 12px;
    }

    p {
      color: #9ca3af;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      margin-bottom: 16px;
      font-size: 16px;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: #3b82f6;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #1d4ed8;
    }

    .success {
      margin-top: 16px;
      color: #22c55e;
    }

    .error {
      margin-top: 16px;
      color: #ef4444;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Join Our Waitlist</h1>
    <p>
      Be the first to know when we launch.
    </p>

    <form id="waitlist-form">
      <!-- Replace with your Web3Forms Access Key -->
      <input
        type="hidden"
        name="access_key"
        value="7e668464-619a-4ff5-86f1-8d2784d96773"
      />

      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required
      />

      <button type="submit">
        Join Waitlist
      </button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("waitlist-form");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const formData = new FormData(form);
      const object = Object.fromEntries(formData);
      const json = JSON.stringify(object);

      result.innerHTML = "Submitting...";

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Accept: "application/json"
          },
          body: json
        });

        const data = await response.json();

        if (response.status === 200) {
          result.innerHTML =
            '<div class="success">🎉 You are on the waitlist!</div>';
          form.reset();
        } else {
          result.innerHTML =
            '<div class="error">' + data.message + "</div>";
        }
      } catch (error) {
        result.innerHTML =
          '<div class="error">Something went wrong.</div>';
      }
    });
  </script>

</body>
</html>
